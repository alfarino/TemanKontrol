# Konfigurasi Cloudflare Zero Trust Tunnel (cloudflared)
# Menggunakan 1 subdomain (temankontrol.unand.tech) untuk API + Privacy Policy sekaligus
# karena Universal SSL Cloudflare Free mencakup wildcard level-1 (*.unand.tech):
#
#    Hostname : temankontrol.unand.tech
#    Service  : http://127.0.0.1:8085
#
tunnel: "<TUNNEL-UUID-ANDA>"
credentials-file: "/etc/cloudflared/<TUNNEL-UUID-ANDA>.json"

ingress:
  - hostname: temankontrol.unand.tech
    service: http://127.0.0.1:8085
  - service: http_status:404
