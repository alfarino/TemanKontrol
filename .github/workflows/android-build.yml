name: Build & Test Android

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'supabase/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Release Keystore (if configured in Secrets)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-key.jks
          cat <<EOF > keystore.properties
          storeFile=release-key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Run Unit Tests, Lint, and Assemble Release APK
        run: |
          chmod +x gradlew
          ./gradlew :shared-dto:jvmTest :server:test :composeApp:jvmTest :composeApp:testAndroidHostTest :app:testDebugUnitTest :app:lintDebug :app:assembleRelease \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            --max-workers=2 --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TemanKontrol-Android-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
