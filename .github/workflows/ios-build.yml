name: Build iOS App & Framework (macOS)

on:
  workflow_dispatch: # Jalankan manual dari tab Actions untuk menghemat kuota runner macOS (10x)

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run KMP Shared Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew :shared-dto:jvmTest :composeApp:jvmTest \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            --max-workers=2 --no-daemon

      - name: Build iOS Release Archive (Unsigned .app / .ipa)
        run: |
          xcodebuild \
            -project iosApp/TemanKontrol.xcodeproj \
            -scheme TemanKontrol \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/TemanKontrol.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package Unsigned IPA for Sideloadly / AltStore Testing
        run: |
          mkdir -p build/ios/Payload
          cp -R build/ios/TemanKontrol.xcarchive/Products/Applications/TemanKontrol.app build/ios/Payload/
          cd build/ios && zip -r TemanKontrol-iOS-unsigned.ipa Payload

      - name: Upload iOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TemanKontrol-iOS
          path: |
            build/ios/TemanKontrol-iOS-unsigned.ipa
            build/ios/TemanKontrol.xcarchive/Products/Applications/TemanKontrol.app/Frameworks/ComposeApp.framework
          retention-days: 14
